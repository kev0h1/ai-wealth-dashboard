# Codemagic CI — Capacitor iOS build.
# (C11 added two Android workflows for Google Play to this same file, see the bottom.)
# The app bundles the Next.js static export (frontend/) inside a native WebView shell (capacitor-spike/).
# Capacitor 8 iOS uses Swift Package Manager (no CocoaPods / Podfile).
#
# FOUR WORKFLOWS: the two iOS workflows (TestFlight) are described next, and
# the two Android workflows (Google Play, C11) at the bottom of this file.
# The "groups" statements below are about the iOS workflows only: the iOS
# workflows have no `environment: groups:` key, so a Codemagic UI variable
# never reaches an iOS build. The Android workflows DO import a variable group
# (`google_play`, holding GCLOUD_SERVICE_ACCOUNT_CREDENTIALS and
# GOOGLE_SERVICES_JSON_BASE64) and one Android keystore (`android_signing:
# sorted_upload_keystore`); see the Android section at the bottom.
#
# TWO WORKFLOWS, same build pipeline, different backend, different branch,
# different TestFlight audience:
#   - ios-capacitor:      bakes the UAT API (https://uat.wealth.auriqltd.co.uk/api).
#                         Triggers automatically on every push to `main` (what
#                         UAT and the shared tree run). Publishes to the
#                         "UAT testers" TestFlight beta group. Use this for
#                         day-to-day TestFlight builds while testing.
#   - ios-capacitor-prod: bakes the production API — still the Vercel-proxied
#                         https://wealth.auriqltd.co.uk/api as of A18 (DNS for
#                         api.wealth.auriqltd.co.uk doesn't exist yet), via
#                         `npm run build:mobile:prod`. Triggers automatically
#                         on every push to `release` (what `scripts/release.py
#                         deploy` fast-forwards to). Publishes to the
#                         "Production" TestFlight beta group. This is the
#                         production TestFlight build used as Q5 compliance
#                         evidence and for the real App Store release.
# Both workflows also stay manually startable from the Codemagic UI (Start
# new build -> pick workflow) or the API/CLI (`--workflow
# ios-capacitor-prod`), same as before — the `triggering:` blocks below only
# add an automatic push trigger, they never remove the manual path. Before
# this the two workflows were told apart only by build number, and either
# could be started from any branch; `triggering:` plus per-workflow
# `branch_patterns` above closes that gap for the automatic case, and the two
# separate beta groups mean a UAT build can no longer reach production
# testers (or vice versa) even if someone manually starts the "wrong"
# workflow from the "wrong" branch. Both beta groups ("UAT testers" and
# "Production") must exist in App Store Connect (Kevin) before either
# workflow's publish step runs; see the `publishing:` comment below for what
# happens if a group is missing.
# Every other step (Capacitor sync, device family, entitlements, signing,
# IPA, publish) is identical between the two — they share one script list, one ios_signing
# block, and (for `app_store_connect.auth`/`submit_to_testflight`) one
# publishing base config via YAML anchors (`&name` / `*name` / `<<:`); only
# `MOBILE_TARGET`, `BUILD_TAG_ENV`, `triggering`, `beta_groups`, and the
# workflow `name` differ. The shared "Build web" step itself reads
# MOBILE_TARGET at runtime ("prod" -> build:mobile:prod, anything else ->
# build:mobile), so its script text is identical too — it is aliased, not
# copy-pasted.
#
# Setup in the Codemagic UI:
#   1. App Store Connect API key integration named "AURIQ LTD" (done).
#   2. Team settings -> Code signing identities: generate the iOS distribution
#      certificate and an App Store provisioning profile for the bundle id below.
#      The ios_signing block fetches them from there at build time.
#
# NOTE — Sign in with Apple: the "Sign in with Apple" capability must be enabled
# on the co.uk.auriqltd.sorted App ID in the Apple Developer portal (it already
# is, and the provisioning profile was generated after that, so no further
# manual step is needed here; the "Add Sign in with Apple entitlement" build
# step below wires the app-side entitlement, which was the only missing piece).
#
# Manual one-time steps for PUSH NOTIFICATIONS (not automatable from here):
#   3. Apple Developer portal -> Certificates, Identifiers & Profiles -> Identifiers
#      -> co.uk.auriqltd.sorted: enable the "Push Notifications" capability on the
#      App ID. Signing here is AUTOMATIC (see the ios_signing block below and the
#      app_store_connect integration), so there is no profile to manually
#      regenerate or re-download. Codemagic requests a provisioning profile from
#      Apple at build time, and enabling a capability invalidates the App ID's
#      existing profiles on Apple's side, which is what forces a fresh one to be
#      issued. So the next build after this step, run with IOS_PUSH_ENABLED set to
#      "true" (see each workflow's environment.vars block below), automatically
#      picks up a profile that already includes the entitlement. No manual
#      profile step is needed. The only manual fallback is deleting a stale
#      profile in the Apple portal if Codemagic somehow reuses one instead of
#      requesting a new one.
#   4. Apple Developer portal -> Keys: create an APNs Auth Key (recommended over a
#      per-app cert — one key covers all your apps and doesn't expire yearly).
#   5. App Store Connect / Codemagic: upload that APNs key so Codemagic (or your
#      backend's push sender) can authenticate to APNs. If push is sent from the
#      backend directly, hand the .p8 key + Key ID + Team ID to whoever owns the
#      backend's push-sending code — do NOT commit it to this repo.
#   6. Once step 3 is done, no separate Codemagic UI env var is needed:
#      IOS_PUSH_ENABLED is set directly in this file's environment.vars blocks
#      (both workflows, below). Flip it there to turn push on or off.
# The `Add Push Notifications entitlement` build step below sets the
# `aps-environment` key in App.entitlements to "production" and wires it into
# the freshly-generated Xcode project (ios/ is not committed, `cap add ios`
# regenerates it every build), but it cannot itself grant the capability on
# Apple's servers or on the provisioning profile, that's steps 3-4 above.
# Capacitor's SPM template ships neither of these things out of the box: no
# entitlements file, and no AppDelegate forwarding of the APNs device token
# to the push plugin. The `Patch AppDelegate for push token forwarding` build
# step right after it fixes the second gap, without it the app registers for
# push at the OS level but the token (or registration error) never reaches
# the JS side.
workflows:
  ios-capacitor:
    name: iOS Capacitor (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # UAT workflow: fires automatically on every push to main (the branch
    # UAT and the shared tree run), and stays manually startable from the
    # Codemagic UI/API/CLI regardless (triggering only adds an automatic
    # trigger, it never removes the manual "Start new build" path).
    triggering: &uat_triggering
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    integrations: &shared_integrations
      app_store_connect: "AURIQ LTD"
    environment:
      xcode: latest
      node: 22
      ios_signing: &shared_ios_signing
        distribution_type: app_store
        bundle_identifier: co.uk.auriqltd.sorted
      vars:
        # Selects which API base the shared "Build web" step below bakes in
        # (see that step's own comment). "uat" (or unset) -> build:mobile,
        # baking https://uat.wealth.auriqltd.co.uk/api. The ios-capacitor-prod
        # workflow below sets this to "prod" instead.
        MOBILE_TARGET: "uat"
        # Prefix for the login/biometric-lock build-tag whisper (see
        # frontend/scripts/build-mobile.sh's compute_build_tag and DEPLOY.md's
        # "Build tag" section) so the environment is visible at a glance on
        # device: "uat build 2026-09-08 abc1234 #42".
        BUILD_TAG_ENV: "uat"
        # This enables the aps-environment entitlement and the remote-notification
        # background mode in the build steps below (see "Register wealthdash URL
        # scheme + Face ID + push background mode" and "Add Push Notifications
        # entitlement"). It's a plain feature flag, not a secret, so it lives here
        # in the repo rather than as a Codemagic UI environment variable: UI
        # variables belong to variable groups that must be imported via an
        # `environment: groups:` key, this iOS workflow has no `groups:` key
        # (only the Android workflows below import one), so a UI-set variable
        # would silently never reach this build.
        #
        # !!! PREREQUISITE, READ BEFORE FLIPPING THIS TO "true" !!!
        # The Push Notifications capability must already be enabled on the
        # co.uk.auriqltd.sorted App ID in the Apple Developer portal (see header
        # comment step 3 above) BEFORE this is set to "true". If the entitlement
        # is requested in a build before Apple has granted the capability, code
        # signing FAILS. Quoted as a string because the build scripts compare it
        # with `[ "${IOS_PUSH_ENABLED:-false}" = "true" ]`, a YAML boolean `true`
        # would not match that string comparison.
        IOS_PUSH_ENABLED: "true"
        # MCP connector flag + URL (backlog A17, mobile reach: F17). UAT-only,
        # matching NEXT_PUBLIC_MCP_CONNECTOR=on / NEXT_PUBLIC_MCP_URL on the
        # UAT frontend service (this VPS's gitignored frontend/.env.local) and
        # DEPLOY.md's "MCP connector flag"/"MCP connector URL" sections.
        # frontend/scripts/build-mobile.sh's shared "Build web" step below
        # would derive the same values from MOBILE_TARGET=uat (the default)
        # on its own, but this workflow sets them explicitly too, same
        # belt-and-braces reasoning as MOBILE_TARGET/BUILD_TAG_ENV above:
        # explicit per-workflow vars are the source of truth for what a
        # given Codemagic workflow bakes, not an implicit script fallback.
        # The ios-capacitor-prod workflow below must NEVER set these — A17
        # doctrine is that the connector stays entirely absent from
        # production until compliance sign-off.
        NEXT_PUBLIC_MCP_CONNECTOR: "on"
        NEXT_PUBLIC_MCP_URL: "https://uat.wealth.auriqltd.co.uk/api/mcp"
        # E6 (docs/ops/OBSERVABILITY.md): Sentry environment tag for this
        # build. The release (full git SHA) is derived by build-mobile.sh. The
        # DSN (NEXT_PUBLIC_SENTRY_DSN) is NEVER written in this file: Kevin
        # provides it through a Codemagic variable group imported with an
        # `environment: groups:` key; until then the app bundle initialises no
        # Sentry and sends nothing.
        NEXT_PUBLIC_APP_ENV: "uat"
    scripts:
      - &step_build_web
        name: Build web (mobile static export)
        script: |
          cd frontend
          npm ci
          # MOBILE_TARGET (set in this workflow's environment.vars block
          # above) selects the API base baked into the static export: "prod"
          # bakes build:mobile:prod's base (as of A18, the Vercel-proxied
          # https://wealth.auriqltd.co.uk/api — see frontend/package.json),
          # anything else (including unset) bakes UAT (npm run build:mobile)
          # — same fallback as local Android APK builds, see
          # frontend/scripts/build-mobile.sh.
          if [ "${MOBILE_TARGET:-uat}" = "prod" ]; then
            npm run build:mobile:prod
          else
            npm run build:mobile
          fi
          rm -rf "$CM_BUILD_DIR/capacitor-spike/www"
          cp -r out "$CM_BUILD_DIR/capacitor-spike/www"
      - &step_capacitor_sync
        name: Add + sync Capacitor iOS
        script: |
          set -e
          cd "$CM_BUILD_DIR/capacitor-spike"
          npm ci
          if [ ! -d ios ]; then npx cap add ios; fi
          # Brand app icons (cap add ios resets AppIcon.appiconset to Capacitor stock icons)
          bash scripts/apply-icons.sh
          npx cap sync ios
      - &step_iphone_only
        name: Target iPhone only (TARGETED_DEVICE_FAMILY = 1)
        script: |
          set -e
          cd "$CM_BUILD_DIR/capacitor-spike/ios/App"
          # Capacitor's iOS template targets both iPhone and iPad
          # (TARGETED_DEVICE_FAMILY = "1,2"), which means App Store Connect
          # requires iPad screenshots at review even though this app is not
          # adapted for iPad. Force iPhone-only (1) on both build
          # configurations so the app is scoped correctly and iPad
          # screenshots stop being required.
          sed -i '' -e 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' -e 's/TARGETED_DEVICE_FAMILY = 2;/TARGETED_DEVICE_FAMILY = 1;/g' App.xcodeproj/project.pbxproj
          COUNT=$(grep -c 'TARGETED_DEVICE_FAMILY = 1;' App.xcodeproj/project.pbxproj)
          echo "TARGETED_DEVICE_FAMILY = 1; count: $COUNT"
          # Fail loud if Capacitor's template ever changes its device-family
          # syntax so the substitution silently no-ops instead of quietly
          # reintroducing an iPad-targeted build.
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: TARGETED_DEVICE_FAMILY = 1 not found after substitution, Capacitor's template may have changed"
            exit 1
          fi
          # Tidy up the now-irrelevant iPad orientation key; harmless once the
          # family is iPhone-only, but there's no reason to keep it.
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" App/Info.plist || true
      - &step_register_scheme
        name: Register wealthdash URL scheme + Face ID + push background mode + export compliance
        script: |
          PLIST="$CM_BUILD_DIR/capacitor-spike/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLName" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string co.uk.auriqltd.sorted" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string wealthdash" "$PLIST"
          # Face ID usage string — required by iOS to show the biometric-auth prompt
          # (used by @aparajita/capacitor-biometric-auth for app-lock). Needs no
          # special entitlement/capability, so this stays on unconditionally.
          /usr/libexec/PlistBuddy -c "Print :NSFaceIDUsageDescription" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Unlock Wealth Dashboard with Face ID.'" "$PLIST"
          # Background mode for remote (push) notifications — gated behind
          # IOS_PUSH_ENABLED (see the "Add Push Notifications entitlement" step
          # below for why: signing fails until the provisioning profile grants
          # Push, so this ships off by default for a clean no-push TestFlight
          # build. IOS_PUSH_ENABLED is set in this yaml's environment.vars block
          # (both workflows, above), not as a Codemagic UI env var. Flip
          # it there to re-enable or disable.
          if [ "${IOS_PUSH_ENABLED:-false}" = "true" ]; then
            /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" "$PLIST"
          else
            echo "Push background mode (UIBackgroundModes remote-notification) SKIPPED (IOS_PUSH_ENABLED != true) — signing a no-push TestFlight build"
          fi
          # Export compliance: HTTPS only via the OS, exempt, so App Store Connect stops asking per build.
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
      - &step_apple_signin
        name: Add Sign in with Apple entitlement
        script: |
          # UNGATED (unlike the push step right after this one): Sign in with
          # Apple needs the com.apple.developer.applesignin entitlement wired
          # into the app for ASAuthorizationController to work at all, and
          # that capability is already enabled on the co.uk.auriqltd.sorted
          # App ID (see the header comment above), so there is no
          # provisioning-profile chicken-and-egg problem to wait on the way
          # there is for push. Enabling the capability on the App ID alone is
          # not enough, the entitlement must also be present in the app's own
          # signed App.entitlements / CODE_SIGN_ENTITLEMENTS, which is what
          # left "Continue with Apple" failing instantly on TestFlight before
          # any network request went out. This has to be its own step (not
          # folded into the push step) because the push step is gated behind
          # IOS_PUSH_ENABLED and this must always run.
          ENTITLEMENTS="$CM_BUILD_DIR/capacitor-spike/ios/App/App/App.entitlements"
          PBXPROJ="$CM_BUILD_DIR/capacitor-spike/ios/App/App.xcodeproj/project.pbxproj"
          if [ ! -f "$ENTITLEMENTS" ]; then
            # Written with printf (not a heredoc) so it's immune to the
            # YAML block-literal's leading indentation — a `<<'EOF'` heredoc
            # here would need its body and terminator at column 0, which the
            # YAML script block can't express, and a space-indented
            # terminator never matches, silently swallowing the rest of this
            # step as heredoc body.
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict>' \
              '</dict>' \
              '</plist>' \
              > "$ENTITLEMENTS"
          fi
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin" "$ENTITLEMENTS" >/dev/null 2>&1 || { /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin array" "$ENTITLEMENTS"; /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin:0 string Default" "$ENTITLEMENTS"; }
          if ! grep -q "CODE_SIGN_ENTITLEMENTS" "$PBXPROJ"; then
            perl -0pi -e 's/(\t+PRODUCT_BUNDLE_IDENTIFIER = co\.uk\.auriqltd\.sorted;\n)/$1\t\t\t\tCODE_SIGN_ENTITLEMENTS = App\/App.entitlements;\n/g; s/(\t+PRODUCT_BUNDLE_IDENTIFIER = com\.getcapacitor\.App;\n)/$1\t\t\t\tCODE_SIGN_ENTITLEMENTS = App\/App.entitlements;\n/g' "$PBXPROJ"
          fi
          # Assert the wiring actually took — if Capacitor's pbxproj format
          # ever changes and the perl substitution silently no-ops, fail loud
          # here instead of shipping a build that's missing the entitlement.
          grep -q "CODE_SIGN_ENTITLEMENTS" "$PBXPROJ" || { echo "ERROR: failed to wire CODE_SIGN_ENTITLEMENTS (apple sign-in) into $PBXPROJ"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin:0" "$ENTITLEMENTS" | grep -q Default || { echo "ERROR: applesignin entitlement missing"; exit 1; }
      - &step_push_entitlement
        name: Add Push Notifications entitlement (aps-environment)
        script: |
          # Gated behind IOS_PUSH_ENABLED (default false/unset): the
          # aps-environment entitlement only signs cleanly if the App Store
          # provisioning profile has been regenerated with the Push
          # Notifications capability (see the header comment above, steps
          # 3-4) — until that's done, wiring CODE_SIGN_ENTITLEMENTS in makes
          # Apple signing FAIL. So today we ship a no-push TestFlight build:
          # this whole step is a no-op unless IOS_PUSH_ENABLED is set to "true"
          # in this yaml's environment.vars block (both workflows,
          # above). Face ID/biometrics is unaffected
          # (needs no capability) — see the previous step.
          if [ "${IOS_PUSH_ENABLED:-false}" = "true" ]; then
            # Capacitor's `cap add ios` template ships no entitlements file and no
            # CODE_SIGN_ENTITLEMENTS build setting. This step creates
            # App.entitlements with aps-environment=production (TestFlight/App
            # Store use production APNs) and wires CODE_SIGN_ENTITLEMENTS into both
            # build configs of the App target so Xcode actually signs with it.
            #
            # This does NOT grant the Push Notifications capability on Apple's
            # servers or add it to the provisioning profile — see the header
            # comment above for the required one-time Apple Developer portal steps.
            ENTITLEMENTS="$CM_BUILD_DIR/capacitor-spike/ios/App/App/App.entitlements"
            PBXPROJ="$CM_BUILD_DIR/capacitor-spike/ios/App/App.xcodeproj/project.pbxproj"
            if [ ! -f "$ENTITLEMENTS" ]; then
              # Written with printf (not a heredoc) so it's immune to the
              # YAML block-literal's leading indentation — a `<<'EOF'` heredoc
              # here would need its body and terminator at column 0, which the
              # YAML script block can't express, and a space-indented
              # terminator never matches, silently swallowing the rest of this
              # step as heredoc body.
              printf '%s\n' \
                '<?xml version="1.0" encoding="UTF-8"?>' \
                '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
                '<plist version="1.0">' \
                '<dict>' \
                '</dict>' \
                '</plist>' \
                > "$ENTITLEMENTS"
            fi
            /usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENTITLEMENTS" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENTITLEMENTS"
            if ! grep -q "CODE_SIGN_ENTITLEMENTS" "$PBXPROJ"; then
              perl -0pi -e 's/(\t+PRODUCT_BUNDLE_IDENTIFIER = co\.uk\.auriqltd\.sorted;\n)/$1\t\t\t\tCODE_SIGN_ENTITLEMENTS = App\/App.entitlements;\n/g; s/(\t+PRODUCT_BUNDLE_IDENTIFIER = com\.getcapacitor\.App;\n)/$1\t\t\t\tCODE_SIGN_ENTITLEMENTS = App\/App.entitlements;\n/g' "$PBXPROJ"
            fi
            # Assert the wiring actually took — if Capacitor's pbxproj format
            # ever changes and the perl substitution silently no-ops, fail loud
            # here instead of shipping a build that's missing the entitlement.
            grep -q "CODE_SIGN_ENTITLEMENTS" "$PBXPROJ" || { echo "ERROR: failed to wire CODE_SIGN_ENTITLEMENTS into $PBXPROJ"; exit 1; }
          else
            echo "Push entitlement (aps-environment / CODE_SIGN_ENTITLEMENTS) SKIPPED (IOS_PUSH_ENABLED != true) — signing a no-push TestFlight build"
          fi
      - &step_appdelegate_patch
        name: Patch AppDelegate for push token forwarding (SPM template gap)
        script: |
          # Gated behind IOS_PUSH_ENABLED, same reasoning as the entitlement
          # step above: this only matters once push is actually being wired
          # in, so it stays a no-op for a clean no-push TestFlight build.
          #
          # Capacitor 8's SPM iOS template (scaffolded fresh by `cap add ios`
          # on every build, ios/ is not committed) ships an AppDelegate.swift
          # that implements neither didRegisterForRemoteNotificationsWithDeviceToken
          # nor its didFail variant. The @capacitor/push-notifications plugin
          # does not override AppDelegate itself, it only listens for the
          # .capacitorDidRegisterForRemoteNotifications and
          # .capacitorDidFailToRegisterForRemoteNotifications NotificationCenter
          # events, which the AppDelegate is supposed to post once iOS hands
          # back the APNs device token (or the registration error). Without
          # these two methods, register() succeeds at the OS level and the JS
          # side never hears anything, so there is no token and no error,
          # ever, just a push permission prompt that silently goes nowhere.
          if [ "${IOS_PUSH_ENABLED:-false}" = "true" ]; then
            APPDELEGATE="$CM_BUILD_DIR/capacitor-spike/ios/App/App/AppDelegate.swift"
            # Matches the class's closing brace, the LAST `}` in the file,
            # anchored with \z so it cannot match anything earlier, and
            # inserts the two forwarding methods before it. This is
            # independent of any specific existing method name, so it stays
            # robust even if Capacitor tweaks the template body, as long as
            # the file is still a single top-level class ending in `}` at
            # EOF. Written with perl (not a heredoc) for the same reason as
            # the entitlement step above: a heredoc terminator cannot survive
            # this YAML block scalar's indentation.
            if ! grep -q "didRegisterForRemoteNotificationsWithDeviceToken" "$APPDELEGATE"; then
              perl -0777 -pi -e 's/\n\}\s*\z/\n\n    func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {\n        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)\n    }\n\n    func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {\n        NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)\n    }\n}\n/' "$APPDELEGATE"
            fi
            # Assert the patch actually took, if Capacitor's template ever
            # changes shape and the perl substitution silently no-ops, fail
            # loud here instead of shipping a build where push tokens die
            # silently inside the app.
            grep -q "didRegisterForRemoteNotificationsWithDeviceToken" "$APPDELEGATE" || { echo "ERROR: failed to patch AppDelegate.swift for push token forwarding"; exit 1; }
          else
            echo "AppDelegate push token forwarding patch SKIPPED (IOS_PUSH_ENABLED != true), building a no-push TestFlight build"
          fi
      - &step_ios_privacy_patch
        name: Patch AppDelegate for app-switcher privacy (A122)
        script: |
          # Not gated on IOS_PUSH_ENABLED: this is independent of push. Adds a
          # UIView cover on didEnterBackground so the iOS app-switcher card
          # never shows live figures. The Swift lives in
          # capacitor-spike/ios-privacy/AppDelegate.privacy.swift.txt. The cover
          # is unconditional (native code cannot read the JS-side lock pref
          # synchronously); the web layer's cover is the lock-gated one.
          APPDELEGATE="$CM_BUILD_DIR/capacitor-spike/ios/App/App/AppDelegate.swift"
          SNIPPET="$CM_BUILD_DIR/capacitor-spike/ios-privacy/AppDelegate.privacy.swift.txt"
          if ! grep -q "sortedInstallPrivacyCover" "$APPDELEGATE"; then
            # 1. call the installer at the top of didFinishLaunchingWithOptions
            perl -0777 -pi -e 's/(didFinishLaunchingWithOptions[^\{]*\{\n)/$1        sortedInstallPrivacyCover()\n/' "$APPDELEGATE"
            # 2. add the methods before the class's closing brace (last `}`)
            SNIPPET_BODY="$(cat "$SNIPPET")" perl -0777 -pi -e 'BEGIN { $b = $ENV{SNIPPET_BODY} } s/\n\}\s*\z/\n$b\n}\n/' "$APPDELEGATE"
          fi
          # Fail loud if Capacitor's template shape changed and either edit no-opped.
          grep -q "sortedInstallPrivacyCover()$" "$APPDELEGATE" || { echo "ERROR: privacy installer call not wired into AppDelegate.swift"; exit 1; }
          grep -q "func sortedInstallPrivacyCover" "$APPDELEGATE" || { echo "ERROR: privacy cover methods not added to AppDelegate.swift"; exit 1; }
      - &step_build_number
        name: Set unique build number
        script: |
          # App Store Connect rejects a TestFlight upload that reuses a
          # (CFBundleShortVersionString, CFBundleVersion) pair. Capacitor's
          # `cap add ios` template ships a static CFBundleVersion of 1, so
          # every upload needs a fresh, ever-increasing CFBundleVersion.
          # Marketing version (CFBundleShortVersionString) is left
          # untouched here — bumping the build number alone is enough to
          # make the pair unique.
          #
          # This used to stamp CFBundleVersion with Codemagic's own
          # $BUILD_NUMBER, an auto-incrementing counter that is scoped PER
          # WORKFLOW. That broke because TWO workflows — ios-capacitor
          # (UAT) and ios-capacitor-prod (production) — publish to the
          # SAME App Store Connect app (co.uk.auriqltd.sorted), each with
          # its own independent $BUILD_NUMBER counter starting at 1: a
          # per-workflow counter cannot stay monotonic across two
          # workflows sharing one build-number namespace. In practice,
          # ios-capacitor-prod's first build uploaded as 1.0 (1), below
          # the ios-capacitor UAT builds already sitting in TestFlight
          # (e.g. build 36), so App Store Connect silently never offered
          # it — TestFlight only ever offers the highest build number it
          # has seen for a given app.
          #
          # Fix: ask App Store Connect itself for the latest TestFlight
          # build number it has actually seen for this app (which reflects
          # uploads from BOTH workflows) and increment that, instead of
          # trusting either workflow's local counter. This step is shared
          # by both workflows via the &step_build_number / *step_build_number
          # anchor, so they read from the same source of truth and stay
          # monotonic together no matter which workflow uploads next.
          #
          # Auth: the app_store_connect integration ("AURIQ LTD", see
          # `integrations:` above, auth: integration below) is already
          # wired into this build image, so the app-store-connect CLI picks
          # up credentials automatically — no --issuer-id/--key-id/
          # --private-key flags needed here.
          cd "$CM_BUILD_DIR/capacitor-spike/ios/App"

          BUNDLE_ID="co.uk.auriqltd.sorted"
          echo "Resolving the App Store Connect app id for bundle id $BUNDLE_ID..."
          APP_ID=$(app-store-connect apps list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier \
            --json | jq -r '.[0].id // empty')
          if [ -z "$APP_ID" ]; then
            echo "ERROR: could not resolve an App Store Connect app id for bundle id $BUNDLE_ID (app-store-connect apps list returned no match). Refusing to guess a build number — check the 'AURIQ LTD' app_store_connect integration has access to this app."
            exit 1
          fi
          echo "App Store Connect app id: $APP_ID"

          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID")
          case "$LATEST" in
            ''|*[!0-9]*)
              echo "ERROR: app-store-connect get-latest-testflight-build-number returned a non-numeric or empty value ('$LATEST') for app id $APP_ID. Refusing to fall back to \$BUILD_NUMBER — that per-workflow counter is exactly what caused this bug."
              exit 1
              ;;
          esac
          NEXT=$((LATEST + 1))
          echo "Latest TestFlight build number across all workflows is $LATEST, setting build number to $NEXT"

          agvtool new-version -all "$NEXT" || \
            sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $NEXT;/g" App.xcodeproj/project.pbxproj
          # Confirm it took
          agvtool what-version -terse || grep -m1 "CURRENT_PROJECT_VERSION" App.xcodeproj/project.pbxproj
      - &step_provisioning
        name: Apply provisioning profiles
        script: |
          cd "$CM_BUILD_DIR/capacitor-spike/ios/App"
          xcode-project use-profiles
      - &step_build_ipa
        name: Build IPA
        script: |
          cd "$CM_BUILD_DIR/capacitor-spike/ios/App"
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App" \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"
    artifacts: &shared_artifacts
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # Publishing is NOT fully shared between the two workflows: both submit
    # to TestFlight via the same App Store Connect integration, but each
    # publishes to its own beta group so UAT and prod builds land in front
    # of the right testers. The common bit (auth + submit_to_testflight) is
    # anchored via &shared_app_store_connect and merged with `<<:`; only
    # `beta_groups` differs per workflow. Both "UAT testers" and
    # "Production" beta groups must already exist in App Store Connect
    # (TestFlight tab -> group name -> +) — Kevin, not automatable from
    # here. If a named group does not exist, Codemagic's publish step fails
    # the build with a "beta group not found" error rather than silently
    # falling back to internal testing, so a missing group is loud, not a
    # silent misroute.
    publishing:
      app_store_connect:
        <<: &shared_app_store_connect
          auth: integration
          submit_to_testflight: true
        beta_groups:
          - "UAT testers"

  ios-capacitor-prod:
    name: iOS Capacitor (TestFlight, production API)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Prod workflow: fires automatically on every push to release (what
    # scripts/release.py deploy fast-forwards to). Also stays manually
    # startable, same as ios-capacitor above.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: release
          include: true
          source: true
      cancel_previous_builds: true
    integrations: *shared_integrations
    environment:
      xcode: latest
      node: 22
      ios_signing: *shared_ios_signing
      vars:
        # Selects which API base the shared "Build web" step bakes in — see
        # that step's comment (defined once, above, in ios-capacitor's
        # scripts list, and reused here via anchor). "prod" -> build:mobile:prod,
        # which as of A18 still bakes the Vercel-proxied
        # https://wealth.auriqltd.co.uk/api (see frontend/package.json and
        # DEPLOY.md's "Mobile: Codemagic TestFlight builds" section) until
        # A18 gives api.wealth.auriqltd.co.uk its own DNS record.
        MOBILE_TARGET: "prod"
        # Same build-tag prefix mechanism as ios-capacitor above, "prod"
        # here so the whisper reads "prod build 2026-09-08 abc1234 #7".
        BUILD_TAG_ENV: "prod"
        # E6: see the same block in ios-capacitor above. Production events are
        # kept apart from UAT by this tag; the DSN comes from the CI environment.
        NEXT_PUBLIC_APP_ENV: "production"
        # This enables the aps-environment entitlement and the remote-notification
        # background mode in the build steps below (see "Register wealthdash URL
        # scheme + Face ID + push background mode" and "Add Push Notifications
        # entitlement"). It's a plain feature flag, not a secret, so it lives here
        # in the repo rather than as a Codemagic UI environment variable: UI
        # variables belong to variable groups that must be imported via an
        # `environment: groups:` key, this iOS workflow has no `groups:` key
        # (only the Android workflows below import one), so a UI-set variable
        # would silently never reach this build.
        #
        # !!! PREREQUISITE, READ BEFORE FLIPPING THIS TO "true" !!!
        # The Push Notifications capability must already be enabled on the
        # co.uk.auriqltd.sorted App ID in the Apple Developer portal (see header
        # comment step 3 above) BEFORE this is set to "true". If the entitlement
        # is requested in a build before Apple has granted the capability, code
        # signing FAILS. Quoted as a string because the build scripts compare it
        # with `[ "${IOS_PUSH_ENABLED:-false}" = "true" ]`, a YAML boolean `true`
        # would not match that string comparison.
        IOS_PUSH_ENABLED: "true"
    scripts:
      - *step_build_web
      - *step_capacitor_sync
      - *step_iphone_only
      - *step_register_scheme
      - *step_apple_signin
      - *step_push_entitlement
      - *step_appdelegate_patch
      - *step_ios_privacy_patch
      - *step_build_number
      - *step_provisioning
      - *step_build_ipa
    artifacts: *shared_artifacts
    publishing:
      app_store_connect:
        <<: *shared_app_store_connect
        beta_groups:
          - "Production"

  # ---------------------------------------------------------------------
  # ANDROID (C11): Google Play, mirroring the iOS pair above.
  #
  #   - android-capacitor:      UAT API, MOBILE_TARGET=uat. Uploads the signed
  #                             AAB to the Play INTERNAL testing track.
  #   - android-capacitor-prod: production API, MOBILE_TARGET=prod. Uploads to
  #                             the Play PRODUCTION track as a DRAFT release
  #                             (submit_as_draft: true), so nothing reaches
  #                             users until Kevin reviews and rolls it out in
  #                             Play Console. scripts/release.py deploy starts
  #                             this workflow after the iOS one.
  #
  # Both are manual-start only for now: there is deliberately NO active
  # `triggering:` block yet (see the commented-out ones below). Kevin has not
  # yet added the three Codemagic inputs they need, so an automatic trigger
  # would fail every push to main. The three inputs (exact names), all in the
  # Codemagic UI:
  #   1. Team settings -> Code signing identities -> Android keystores: upload
  #      capacitor-spike/android/keys/upload-keystore.jks with reference name
  #      `sorted_upload_keystore`, alias `upload`, and the store/key password
  #      from capacitor-spike/android/keystore.properties (same value for
  #      both, PKCS12). This is the Play UPLOAD key (Play App Signing holds
  #      the app signing key), see DEPLOY.md "Android release signing".
  #   2. A variable group named `google_play` (secure variables) holding
  #      GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (the Play service-account JSON,
  #      pasted as is) and GOOGLE_SERVICES_JSON_BASE64 (base64 -w0 of
  #      capacitor-spike/google-services.json, which is gitignored so the
  #      build cannot read it from the repo).
  #   3. The Play service account itself, with release permissions on the app
  #      (DEPLOY.md "Android: Codemagic Play builds").
  # Once all three exist, uncomment the `triggering:` block on each workflow.
  #
  # Differences from the iOS pair: Linux machine, Java 21 (Capacitor 8's
  # Android library compiles at Java 21), no flavours (`cap add android`
  # generates a plain project, so the Gradle task is bundleRelease, not
  # bundleSortedRelease; Board is not built here), and the versionCode is
  # Google Play's latest + 1 (google-play get-latest-build-number), the same
  # refuse-to-guess pattern as the iOS "Set unique build number" step and for
  # the same reason: Play rejects any reused versionCode across all tracks and
  # Codemagic's per-workflow $BUILD_NUMBER cannot stay monotonic across two
  # workflows (or the manual first upload, versionCode 3, versionName 1.0.0).
  # ---------------------------------------------------------------------
  android-capacitor:
    name: Android Capacitor (Play internal testing)
    instance_type: linux_x2
    max_build_duration: 60
    # Manual-start only until the three Codemagic inputs above exist. Then
    # uncomment: fires on every push to main, like ios-capacitor.
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: main
    #       include: true
    #       source: true
    #   cancel_previous_builds: true
    environment:
      node: 22
      java: 21
      groups:
        - google_play
      android_signing:
        - sorted_upload_keystore
      vars:
        # Same meanings as in ios-capacitor above.
        MOBILE_TARGET: "uat"
        BUILD_TAG_ENV: "uat"
        NEXT_PUBLIC_MCP_CONNECTOR: "on"
        NEXT_PUBLIC_MCP_URL: "https://uat.wealth.auriqltd.co.uk/api/mcp"
        NEXT_PUBLIC_APP_ENV: "uat"
    scripts:
      - *step_build_web
      - &step_android_google_services
        name: Restore google-services.json
        script: |
          set -e
          # capacitor-spike/google-services.json is gitignored (it is not a
          # secret, but it is deliberately untracked), so CI restores it from
          # the google_play variable group. setup-android-push.sh requires it.
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 is not set. Add it to the Codemagic variable group google_play (base64 -w0 of capacitor-spike/google-services.json)."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$CM_BUILD_DIR/capacitor-spike/google-services.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert any(c['client_info']['android_client_info']['package_name']=='co.uk.auriqltd.sorted' for c in d['client']), 'no client for co.uk.auriqltd.sorted'" "$CM_BUILD_DIR/capacitor-spike/google-services.json" || { echo "ERROR: decoded google-services.json is not valid or has no co.uk.auriqltd.sorted client"; exit 1; }
          echo "google-services.json restored (co.uk.auriqltd.sorted client present)."
      - &step_android_sync
        name: Add + patch + sync Capacitor Android
        script: |
          set -e
          cd "$CM_BUILD_DIR/capacitor-spike"
          npm ci
          if [ ! -d android ]; then npx cap add android; fi
          # apply-icons.sh needs ImageMagick's `convert` for the Android icons.
          if ! command -v convert >/dev/null 2>&1; then
            echo "ImageMagick not found on this image, installing it."
            (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick) || { echo "ERROR: could not install ImageMagick for apply-icons.sh"; exit 1; }
          fi
          bash scripts/apply-icons.sh
          # FCM, privacy plugin, backup rules, and (C11) release signing. With
          # the sorted_upload_keystore reference loaded, CM_KEYSTORE_PATH etc.
          # are set and this writes android/keystore.properties from them.
          bash scripts/setup-android-push.sh
          npx cap sync android
      - &step_android_version
        name: Set versionCode (Play latest + 1) and native debug symbols
        script: |
          set -e
          cd "$CM_BUILD_DIR/capacitor-spike"
          if [ -z "${GCLOUD_SERVICE_ACCOUNT_CREDENTIALS:-}" ]; then
            echo "ERROR: GCLOUD_SERVICE_ACCOUNT_CREDENTIALS is not set. Add the Play service-account JSON to the Codemagic variable group google_play. Refusing to guess a versionCode."
            exit 1
          fi
          # Play rejects any reused versionCode across ALL tracks, so ask Play
          # for the highest it has seen and add one. Do not fall back to
          # $BUILD_NUMBER: that per-workflow counter is not monotonic across
          # the two Android workflows or the manual first upload.
          LATEST=$(google-play get-latest-build-number \
            --package-name co.uk.auriqltd.sorted \
            --credentials "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS") || { echo "ERROR: google-play get-latest-build-number failed. Check the service account has access to co.uk.auriqltd.sorted in Play Console. Refusing to guess a versionCode."; exit 1; }
          case "$LATEST" in
            ''|*[!0-9]*)
              echo "ERROR: google-play get-latest-build-number returned a non-numeric or empty value ('$LATEST'). Refusing to fall back to \$BUILD_NUMBER."
              exit 1
              ;;
          esac
          NEXT=$((LATEST + 1))
          echo "Latest Google Play versionCode is $LATEST, setting versionCode to $NEXT"
          # versionName comes from frontend/public/sorted-apk.json (required
          # there); only versionCode is overridden.
          VERSION_CODE="$NEXT" bash scripts/set-android-version.sh
          # So Play stops warning that the bundle has native code but no
          # debug symbols. native-debug-symbols.zip is only emitted when a
          # bundled .so still carries symbols; today the only native library
          # (androidx datastore) is already stripped, so no zip appears and
          # the artifact glob below simply matches nothing. If a symbol-bearing
          # native dependency is added, the zip appears with no change here.
          bash scripts/setup-android-debug-symbols.sh
      - &step_android_bundle
        name: Build signed AAB (bundleRelease)
        script: |
          set -e
          cd "$CM_BUILD_DIR/capacitor-spike/android"
          chmod +x gradlew
          # No product flavours in CI (see the Android section header), so the
          # plain bundleRelease. The release signingConfig comes from
          # keystore.properties, written by setup-android-signing.sh.
          ./gradlew bundleRelease
          # Fail loud if the bundle came out unsigned.
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          jarsigner -verify "$AAB" | grep -q "jar verified" || { echo "ERROR: $AAB is not signed"; exit 1; }
    artifacts: &android_artifacts
      - capacitor-spike/android/app/build/outputs/bundle/release/*.aab
      - capacitor-spike/android/app/build/outputs/**/native-debug-symbols.zip
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal

  android-capacitor-prod:
    name: Android Capacitor (Play production draft, production API)
    instance_type: linux_x2
    max_build_duration: 60
    # Manual-start only until the three Codemagic inputs above exist (and
    # scripts/release.py deploy also starts it by API). Then uncomment: fires
    # on every push to release, like ios-capacitor-prod. Note that deploy
    # already starts this workflow explicitly, so enabling both would build
    # twice per release; enable this only if deploy's trigger is not relied on.
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: release
    #       include: true
    #       source: true
    #   cancel_previous_builds: true
    environment:
      node: 22
      java: 21
      groups:
        - google_play
      android_signing:
        - sorted_upload_keystore
      vars:
        # Same meanings as in ios-capacitor-prod above. The MCP connector
        # flags are NEVER set here (A17 doctrine).
        MOBILE_TARGET: "prod"
        BUILD_TAG_ENV: "prod"
        NEXT_PUBLIC_APP_ENV: "production"
    scripts:
      - *step_build_web
      - *step_android_google_services
      - *step_android_sync
      - *step_android_version
      - *step_android_bundle
    artifacts: *android_artifacts
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        # A draft release: nothing reaches users until Kevin reviews and
        # rolls it out in Play Console.
        submit_as_draft: true
