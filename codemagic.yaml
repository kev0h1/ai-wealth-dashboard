# Codemagic CI — Capacitor iOS build.
# The app bundles the Next.js static export (frontend/) inside a native WebView shell (capacitor-spike/).
# One-time setup in the Codemagic UI: add an App Store Connect API key integration named "Auriq".
workflows:
  ios-capacitor:
    name: iOS Capacitor (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "AURIQ LTD"
    environment:
      xcode: latest
      cocoapods: default
      node: 22
      vars:
        BUNDLE_ID: "co.uk.auriqltd.wealth"
    scripts:
      - name: Build web (mobile static export)
        script: |
          cd frontend
          npm ci
          npm run build:mobile
          rm -rf "$CM_BUILD_DIR/capacitor-spike/www"
          cp -r out "$CM_BUILD_DIR/capacitor-spike/www"
      - name: Add + sync Capacitor iOS
        script: |
          cd "$CM_BUILD_DIR/capacitor-spike"
          npm ci
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Install CocoaPods deps
        script: |
          cd "$CM_BUILD_DIR/capacitor-spike/ios/App"
          pod install
      - name: Set up code signing (create cert/profile if missing)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          cd "$CM_BUILD_DIR/capacitor-spike/ios/App"
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd "$CM_BUILD_DIR/capacitor-spike/ios/App"
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "App" \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
