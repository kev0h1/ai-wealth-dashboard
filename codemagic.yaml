# Codemagic CI — Capacitor iOS build.
# The app bundles the Next.js static export (frontend/) inside a native WebView shell (capacitor-spike/).
# Capacitor 8 iOS uses Swift Package Manager (no CocoaPods / Podfile).
# Setup in the Codemagic UI:
#   1. App Store Connect API key integration named "AURIQ LTD" (done).
#   2. Team settings -> Code signing identities: generate the iOS distribution
#      certificate and an App Store provisioning profile for the bundle id below.
#      The ios_signing block fetches them from there at build time.
#
# Manual one-time steps for PUSH NOTIFICATIONS (not automatable from here):
#   3. Apple Developer portal -> Certificates, Identifiers & Profiles -> Identifiers
#      -> co.uk.auriqltd.wealth: enable the "Push Notifications" capability on the
#      App ID, then regenerate/re-download the App Store provisioning profile
#      referenced by ios_signing so it includes the entitlement.
#   4. Apple Developer portal -> Keys: create an APNs Auth Key (recommended over a
#      per-app cert — one key covers all your apps and doesn't expire yearly).
#   5. App Store Connect / Codemagic: upload that APNs key so Codemagic (or your
#      backend's push sender) can authenticate to APNs. If push is sent from the
#      backend directly, hand the .p8 key + Key ID + Team ID to whoever owns the
#      backend's push-sending code — do NOT commit it to this repo.
# The `Add Push Notifications entitlement` build step below sets the
# `aps-environment` key in App.entitlements to "production" and wires it into
# the freshly-generated Xcode project (ios/ is not committed — `cap add ios`
# regenerates it every build), but it cannot itself grant the capability on
# Apple's servers or on the provisioning profile — that's steps 3-4 above.
workflows:
  ios-capacitor:
    name: iOS Capacitor (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "AURIQ LTD"
    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: co.uk.auriqltd.wealth
    scripts:
      - name: Build web (mobile static export)
        script: |
          cd frontend
          npm ci
          # MOBILE_API_URL points the built app at a backend. Set this as a
          # Codemagic environment variable (or env group) to override.
          # TODO: set to UAT backend URL — defaults to prod for now.
          export MOBILE_API_URL="${MOBILE_API_URL:-https://wealth.auriqltd.co.uk/api}"
          npm run build:mobile
          rm -rf "$CM_BUILD_DIR/capacitor-spike/www"
          cp -r out "$CM_BUILD_DIR/capacitor-spike/www"
      - name: Add + sync Capacitor iOS
        script: |
          cd "$CM_BUILD_DIR/capacitor-spike"
          npm ci
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Register wealthdash URL scheme + Face ID + push background mode
        script: |
          PLIST="$CM_BUILD_DIR/capacitor-spike/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLName" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string co.uk.auriqltd.wealth" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string wealthdash" "$PLIST"
          # Face ID usage string — required by iOS to show the biometric-auth prompt
          # (used by @aparajita/capacitor-biometric-auth for app-lock).
          /usr/libexec/PlistBuddy -c "Print :NSFaceIDUsageDescription" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Unlock Wealth Dashboard with Face ID.'" "$PLIST"
          # Background mode for remote (push) notifications.
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" "$PLIST"
      - name: Add Push Notifications entitlement (aps-environment)
        script: |
          # Capacitor's `cap add ios` template ships no entitlements file and no
          # CODE_SIGN_ENTITLEMENTS build setting. This step creates
          # App.entitlements with aps-environment=production (TestFlight/App
          # Store use production APNs) and wires CODE_SIGN_ENTITLEMENTS into both
          # build configs of the App target so Xcode actually signs with it.
          #
          # This does NOT grant the Push Notifications capability on Apple's
          # servers or add it to the provisioning profile — see the header
          # comment above for the required one-time Apple Developer portal steps.
          ENTITLEMENTS="$CM_BUILD_DIR/capacitor-spike/ios/App/App/App.entitlements"
          PBXPROJ="$CM_BUILD_DIR/capacitor-spike/ios/App/App.xcodeproj/project.pbxproj"
          if [ ! -f "$ENTITLEMENTS" ]; then
            # Written with printf (not a heredoc) so it's immune to the
            # YAML block-literal's leading indentation — a `<<'EOF'` heredoc
            # here would need its body and terminator at column 0, which the
            # YAML script block can't express, and a space-indented
            # terminator never matches, silently swallowing the rest of this
            # step as heredoc body.
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict>' \
              '</dict>' \
              '</plist>' \
              > "$ENTITLEMENTS"
          fi
          /usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENTITLEMENTS" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENTITLEMENTS"
          if ! grep -q "CODE_SIGN_ENTITLEMENTS" "$PBXPROJ"; then
            perl -0pi -e 's/(\t+PRODUCT_BUNDLE_IDENTIFIER = co\.uk\.auriqltd\.wealth;\n)/$1\t\t\t\tCODE_SIGN_ENTITLEMENTS = App\/App.entitlements;\n/g; s/(\t+PRODUCT_BUNDLE_IDENTIFIER = com\.getcapacitor\.App;\n)/$1\t\t\t\tCODE_SIGN_ENTITLEMENTS = App\/App.entitlements;\n/g' "$PBXPROJ"
          fi
          # Assert the wiring actually took — if Capacitor's pbxproj format
          # ever changes and the perl substitution silently no-ops, fail loud
          # here instead of shipping a build that's missing the entitlement.
          grep -q "CODE_SIGN_ENTITLEMENTS" "$PBXPROJ" || { echo "ERROR: failed to wire CODE_SIGN_ENTITLEMENTS into $PBXPROJ"; exit 1; }
      - name: Apply provisioning profiles
        script: |
          cd "$CM_BUILD_DIR/capacitor-spike/ios/App"
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd "$CM_BUILD_DIR/capacitor-spike/ios/App"
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App" \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
