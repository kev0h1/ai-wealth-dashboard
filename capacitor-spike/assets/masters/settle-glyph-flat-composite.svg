<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Flat COMPOSITE icon (icon.png / ios-AppIcon-1024.png source) — 2026-08-27
    no-glow decision. Flat background + full-scale glyph, matching the
    ORIGINAL composite's framing (git HEAD icon.png measured glyph bbox
    ≈558x534px, 54.5% x 52.1% of the 1024 canvas, centred ~(511,499)) —
    i.e. identical geometry to settle-glyph-master.svg, just redeclared here
    alongside its flat sibling layers for a single self-contained record of
    what was actually rendered for the launcher icon set.
  -->
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" fill="#0f172a" />

  <g>
    <rect x="292" y="257" width="475" height="119" rx="28.6" fill="#475569"
      transform="rotate(6.86 529.5 316.5)" />
    <rect x="241" y="447" width="505" height="119" rx="28.5" fill="#475569"
      transform="rotate(-6.84 493.5 506.5)" />
    <rect x="232" y="637" width="559" height="129" rx="31.5" fill="url(#brandGradient)" />
  </g>
</svg>
