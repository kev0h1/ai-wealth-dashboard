<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient></defs>
<rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="#0f172a"/>
  <g>
    <!-- Top slate bar — tilts clockwise, "unsettled" -->
    <rect
      x="292" y="257"
      width="475" height="119"
      rx="28.6"
      fill="#475569"
      transform="rotate(6.86 529.5 316.5)"
    />
    <!-- Middle slate bar — tilts counter-clockwise, opposing lean -->
    <rect
      x="241" y="447"
      width="505" height="119"
      rx="28.5"
      fill="#475569"
      transform="rotate(-6.84 493.5 506.5)"
    />
    <!-- Bottom gradient bar — flat, widest, the "settled" state -->
    <rect
      x="232" y="637"
      width="559" height="129"
      rx="31.5"
      fill="url(#brandGradient)"
    />
  </g>
</svg>
